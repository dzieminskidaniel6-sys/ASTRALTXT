name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['**.gd','**.tscn','**.godot','export_presets.cfg','.github/workflows/android.yml']
jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.4.1
    env:
      JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
      ANDROID_HOME: /usr/lib/android-sdk
      ANDROID_SDK_ROOT: /usr/lib/android-sdk
    steps:
      - uses: actions/checkout@v4
      - name: Install Android SDK packages
        run: |
          apt-get update
          apt-get install -y openjdk-17-jdk unzip wget
          yes | sdkmanager --sdk_root="$ANDROID_SDK_ROOT" --licenses || true
          sdkmanager --sdk_root="$ANDROID_SDK_ROOT" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          test -x "$ANDROID_SDK_ROOT/build-tools/35.0.0/apksigner"
          test -x "$ANDROID_SDK_ROOT/platform-tools/adb"
      - name: Install matching Godot export templates
        run: |
          mkdir -p "$HOME/.local/share/godot/export_templates/4.4.1.stable"
          wget -q https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_export_templates.tpz -O /tmp/godot-templates.tpz
          mkdir -p /tmp/godot-templates
          unzip -q /tmp/godot-templates.tpz -d /tmp/godot-templates
          cp /tmp/godot-templates/templates/* "$HOME/.local/share/godot/export_templates/4.4.1.stable/"
      - name: Configure Godot Android paths
        run: |
          mkdir -p "$HOME/.config/godot" "$HOME/.android"
          keytool -genkeypair -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/android_sdk_path = "$ANDROID_SDK_ROOT"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$HOME/.android/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF
      - run: mkdir -p build
      - name: Import project
        run: godot --headless --editor --path . --quit
      - name: Export APK
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: /github/home/.android/debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          godot --headless --verbose --path . --export-debug Android build/wies-exe.apk
          test -s build/wies-exe.apk
      - uses: actions/upload-artifact@v4
        with:
          name: wies-exe-android
          path: build/wies-exe.apk
