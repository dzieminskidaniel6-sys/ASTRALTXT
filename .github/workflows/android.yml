name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['**.gd','**.tscn','**.godot','export_presets.cfg','.github/workflows/android.yml']
jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.4.1
    env:
      JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
      ANDROID_HOME: /usr/lib/android-sdk
      ANDROID_SDK_ROOT: /usr/lib/android-sdk
    steps:
      - uses: actions/checkout@v4
      - name: Install Android build tools and Java
        run: |
          apt-get update
          apt-get install -y openjdk-17-jdk unzip wget
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Install matching Godot export templates
        run: |
          mkdir -p "$HOME/.local/share/godot/export_templates/4.4.1.stable"
          wget -q https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_export_templates.tpz -O /tmp/godot-templates.tpz
          mkdir -p /tmp/godot-templates
          unzip -q /tmp/godot-templates.tpz -d /tmp/godot-templates
          cp /tmp/godot-templates/templates/* "$HOME/.local/share/godot/export_templates/4.4.1.stable/"
      - name: Create debug signing key
        run: |
          mkdir -p "$HOME/.android"
          keytool -genkeypair -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
      - run: mkdir -p build
      - name: Import project
        run: godot --headless --editor --path . --quit
      - name: Export APK
        run: godot --headless --path . --export-debug Android build/wies-exe.apk
      - uses: actions/upload-artifact@v4
        with:
          name: wies-exe-android
          path: build/wies-exe.apk
